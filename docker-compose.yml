version: "3"

services:
  bot:
    build: .
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CREDENTIALS_JSON=${GOOGLE_CREDENTIALS_JSON}
      - GOOGLE_TOKEN_JSON=${GOOGLE_TOKEN_JSON}
      - SHEET_ID=${SHEET_ID}
      - SHEET_HEADER_RANGE=${SHEET_HEADER_RANGE}
      - SHEET_RANGE_TEMPLATE=${SHEET_RANGE_TEMPLATE}
